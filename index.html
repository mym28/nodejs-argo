:root {
--bg: #000000;

html {
scroll-behavior: smooth;
}

body {
background: var(--bg);
color: var(--light);
font-family: 'Segoe UI', sans-serif;
overflow-x: hidden;
}

/* 自定义滚动条 */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: var(--primary); }

/* 导航 悬浮极简 */
nav {
position: fixed;
top: 0;
width: 100%;
padding: 2rem 6%;
display: flex;
justify-content: space-between;
align-items: center;
z-index: 999;
}

.logo {
font-size: 1.4rem;
letter-spacing: 3px;
color: var(--primary);
font-weight: 600;
}

.nav-links a {
color: var(--muted);
text-decoration: none;
margin-left: 2rem;
font-size: 0.9rem;
transition: 0.3s;
}

.nav-links a:hover {
color: var(--primary);
}

/* 核心独家：3D 断层破碎首屏布局 */
.hero {
width: 100%;
height: 100vh;
position: relative;
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 6%;
}

/* 左右断层几何色块 /
.hero-shape-left {
position: absolute;
top: 0;
left: 0;
width: 52%;
height: 100%;
background: #050505;
/ 独家斜切破碎角度 */
clip-path: polygon(0 0, 100% 0, 92% 100%, 0% 100%);
z-index: 1;
}

.hero-shape-right {
position: absolute;
top: 0;
right: 0;
width: 52%;
height: 100%;
background: url("https://aka.doubaocdn.com/s/vtXp1wiyBk") center top / cover no-repeat;
clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
}

/* 文字层级 */
.hero-text {
position: relative;
z-index: 2;
max-width: 500px;
}

.hero-tag {
color: var(--primary);
letter-spacing: 4px;
font-size: 0.8rem;
margin-bottom: 1.2rem;
text-transform: uppercase;
}

.hero-title {
font-size: 4.2rem;
line-height: 1.1;
margin-bottom: 1.8rem;
}

.hero-title span {
color: var(--primary);
}

.hero-desc {
color: var(--muted);
line-height: 1.8;
margin-bottom: 2.5rem;
}

.hero-btn {
padding: 12px 34px;
border: 1px solid var(--primary);
color: var(--primary);
text-decoration: none;
font-size: 0.9rem;
transition: 0.3s ease;
}

.hero-btn:hover {
background: var(--primary);
color: #000;
box-shadow: 0 0 20px #7c68ff40;
}

/* 断层分割区域 */
.fracture-space {
height: 120px;
position: relative;
background: #000;
}

.slant-line {
position: absolute;
width: 100%;
height: 1px;
background: linear-gradient(90deg, transparent, #7c68ff30, transparent);
transform: skewX(-20deg);
}

/* 几何卡片区域 */
.cards-section {
padding: 4rem 6% 8rem;
display: grid;
grid-template-columns: repeat(3,1fr);
gap: 1.5rem;
}

.geo-card {
padding: 2.5rem 2rem;
background: #070707;
border: 1px solid #151515;
transition: 0.4s ease;
clip-path: polygon(0 0, 100% 0, 100% 94%, 0 100%);
}

.geo-card:hover {
border-color: #7c68ff40;
transform: translateY(-6px);
}

.geo-card h3 {
font-size: 1.3rem;
margin-bottom: 1rem;
}

.geo-card p {
color: var(--muted);
font-size: 0.9rem;
line-height: 1.7;
}

/* 作品不规则网格 */
.works {
padding: 0 6% 8rem;
display: grid;
grid-template-columns: 1.4fr 1fr;
gap: 1.5rem;
}

.work-big {
height: 460px;
background: url("https://aka.doubaocdn.com/s/bnGb1wixwz") center/cover;
clip-path: polygon(0 0, 100% 0, 100% 100%, 4% 100%);
}

.work-stack {
display: flex;
flex-direction: column;
gap: 1.5rem;
}

.work-small-1 {
height: 220px;
background: url("https://aka.doubaocdn.com/s/M7Gk1wixmO") center/cover;
clip-path: polygon(0 0, 100% 0, 100% 96%, 0 100%);
}

.work-small-2 {
height: 220px;
background: url("https://aka.doubaocdn.com/s/50rR1wiyjF") center/cover;
clip-path: polygon(0 4%, 100% 0, 100% 100%, 0 100%);
}

/* 页脚 */
footer {
padding: 3rem 6%;
border-top: 1px solid #111;
text-align: center;
color: #555;
font-size: 0.9rem;
}

/* 移动端适配 */
@media(max-width:900px){
.hero-shape-left,.hero-shape-right{
clip-path: none;
width:100%;
}
.hero-shape-right{
opacity:0.25;
}
.hero-title{
font-size:2.6rem;
}
.cards-section{
grid-template-columns:1fr 1fr;
}
.works{
grid-template-columns:1fr;
}
.nav-links{
display:none;
}
}
@media(max-width:550px){
.cards-section{
grid-template-columns:1fr;
}
.hero-title{
font-size:2rem;
}
