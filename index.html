<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静叙 · Silent Narrative</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --main-black: #000000;
            --text-main: #e8e8e8;
            --text-sub: #8a8a8a;
            --accent: #c9b89c;
            --line-color: rgba(201, 184, 156, 0.15);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Noto Serif SC", "SimSun", serif;
            background-color: var(--main-black);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.8;
            background-image: linear-gradient(var(--line-color) 1px, transparent 1px),
                              linear-gradient(90deg, var(--line-color) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* 自定义细滚动条 */
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: var(--main-black);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
        }

        /* 顶部极简导航 */
        .nav-wrap {
            width: 100%;
            padding: 2.2rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
        }

        .logo {
            font-size: 1.3rem;
            letter-spacing: 6px;
            color: var(--accent);
            font-weight: 400;
        }

        .nav-menu a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-left: 2.2rem;
            transition: color 0.3s ease;
        }

        .nav-menu a:hover {
            color: var(--accent);
        }

        /* 首屏：左右错落叙事布局 */
        .hero {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            align-items: center;
            padding: 0 8%;
            padding-top: 8rem;
            gap: 4rem;
        }

        .hero-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-en {
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }

        .hero-title {
            font-size: 3.8rem;
            font-weight: 400;
            line-height: 1.3;
            margin-bottom: 2rem;
        }

        .hero-desc {
            color: var(--text-sub);
            font-size: 1.05rem;
            max-width: 380px;
            margin-bottom: 2.8rem;
        }

        .hero-btn {
            display: inline-block;
            width: fit-content;
            padding: 12px 36px;
            border: 1px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: all 0.35s ease;
        }

        .hero-btn:hover {
            background: var(--accent);
            color: #000;
        }

        .hero-img {
            height: 82vh;
            background: url("https://aka.doubaocdn.com/s/vtXp1wiyBk") center top / cover no-repeat;
            border-radius: 2px;
            /* 上下柔焦隐去 */
            -webkit-mask-image: linear-gradient(to bottom, transparent 3%, black 12%, black 88%, transparent 97%);
            mask-image: linear-gradient(to bottom, transparent 3%, black 12%, black 88%, transparent 97%);
        }

        /* 语录分区 */
        .quote-section {
            padding: 7rem 8%;
            text-align: center;
        }

        .quote-mark {
            font-size: 4rem;
            color: rgba(201, 184, 156, 0.2);
            line-height: 1;
            margin-bottom: -1rem;
        }

        .quote-text {
            font-size: 1.6rem;
            max-width: 700px;
            margin: 0 auto 1.5rem;
            color: var(--text-main);
        }

        .quote-author {
            color: var(--accent);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        /* 图文陈列区：竖向卡片 */
        .gallery-section {
            padding: 0 8% 7rem;
        }

        .section-head {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-head p {
            color: var(--accent);
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.8rem;
        }

        .gallery-card {
            overflow: hidden;
            position: relative;
        }

        .gallery-card img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            transition: transform 0.5s ease;
            filter: brightness(0.9);
        }

        .gallery-card:hover img {
            transform: scale(1.06);
            filter: brightness(1);
        }

        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1.8rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .card-title {
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
        }

        .card-sub {
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        /* 页脚 */
        footer {
            padding: 3rem 8%;
            border-top: 1px solid var(--line-color);
            text-align: center;
            color: var(--text-sub);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* 移动端适配 */
        @media (max-width: 992px) {
            .hero {
                grid-template-columns: 1fr;
                gap: 2.5rem;
            }
            .hero-title {
                font-size: 2.6rem;
            }
            .hero-img {
                height: 55vh;
            }
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .nav-menu {
                display: none;
            }
        }

        @media (max-width: 576px) {
            .hero-title {
                font-size: 2rem;
            }
            .quote-text {
                font-size: 1.2rem;
            }
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 导航 -->
    <div class="nav-wrap">
        <div class="logo">静叙 SILENT</div>
        <div class="nav-menu">
            <a href="#home">首页</a>
            <a href="#quote">语录</a>
            <a href="#gallery">陈列</a>
        </div>
    </div>

    <!-- 首屏 -->
    <section class="hero" id="home">
        <div class="hero-text">
            <p class="hero-en">Silent Narrative</p>
            <h1 class="hero-title">
                于无声处<br>
                聆听时光
            </h1>
            <p class="hero-desc">
                褪去喧嚣，留存温柔。在纯粹的黑与光影之间，记录每一段安静的故事。
            </p>
            <a href="#gallery" class="hero-btn">慢慢浏览</a>
        </div>
        <div class="hero-img"></div>
    </section>

    <!-- 诗意语录区 -->
    <section class="quote-section" id="quote">
        <div class="quote-mark">“</div>
        <p class="quote-text">
            风停在窗边，嘱咐我要热爱这个世界。
        </p>
        <p class="quote-author">—— 静叙手记</p>
    </section>

    <!-- 图文陈列区 -->
    <section class="gallery-section" id="gallery">
        <div class="section-head">
            <p>Collection · 风物陈列</p>
        </div>
        <div class="gallery-grid">
            <div class="gallery-card">
                <img src="https://aka.doubaocdn.com/s/50rR1wiyjF" alt="人像">
                <div class="card-info">
                    <div class="card-title">晚风独白</div>
                    <div class="card-sub">Evening Breeze</div>
                </div>
            </div>
            <div class="gallery-card">
                <img src="https://aka.doubaocdn.com/s/bnGb1wixwz" alt="人像">
                <div class="card-info">
                    <div class="card-title">暮色光影</div>
                    <div class="card-sub">Twilight Light</div>
                </div>
            </div>
            <div class="gallery-card">
                <img src="https://aka.doubaocdn.com/s/M7Gk1wixmO" alt="人像">
                <div class="card-info">
                    <div class="card-title">静谧时刻</div>
                    <div class="card-sub">Quiet Moment</div>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        静叙 Silent Narrative © 2026 | 以静默，叙流年
    </footer>
</body>
</html>
