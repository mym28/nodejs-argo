<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 锁屏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* Windows 11 默认锁屏背景 */
            background: url('https://picsum.photos/id/1039/1920/1080') center/cover no-repeat;
            position: relative;
            cursor: default;
            user-select: none;
        }

        /* 背景遮罩，和真实锁屏一致 */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
        }

        /* 左下角时间日期 */
        .time-area {
            position: absolute;
            bottom: 60px;
            left: 60px;
            color: #ffffff;
            z-index: 10;
        }

        .time {
            font-size: 72px;
            font-weight: 300;
            line-height: 1;
            margin-bottom: 8px;
        }

        .date {
            font-size: 20px;
            font-weight: 400;
            opacity: 0.95;
        }

        /* 右下角系统图标 */
        .system-icons {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 20px;
            color: #ffffff;
            font-size: 18px;
            opacity: 0.9;
            z-index: 10;
        }

        /* 登录区域 */
        .login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            text-align: center;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .login-container.show {
            opacity: 1;
            transform: translate(-50%, -50%);
        }

        /* 用户头像 */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: url('https://aka.doubaocdn.com/s/vtXp1wiyBk') center/cover;
            margin: 0 auto 20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .username {
            color: #ffffff;
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 20px;
        }

        /* 密码输入框 */
        .password-input {
            width: 320px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .password-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .password-input:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.2);
        }

        /* 登录按钮 */
        .login-btn {
            width: 320px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .login-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .login-btn:active {
            transform: scale(0.99);
        }

        /* 提示文字 */
        .hint {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            z-index: 10;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        /* 登录成功动画 */
        .success-overlay {
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        .success-overlay.show {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>
<body onclick="showLogin()">

    <div class="overlay"></div>

    <!-- 时间日期 -->
    <div class="time-area">
        <div class="time" id="time">00:00</div>
        <div class="date" id="date">2026年1月1日 星期四</div>
    </div>

    <!-- 右下角系统图标 -->
    <div class="system-icons">
        <span>🔊</span>
        <span>📶</span>
        <span>🔋</span>
    </div>

    <!-- 点击提示 -->
    <div class="hint" id="hint">点击任意处解锁</div>

    <!-- 登录区域 -->
    <div class="login-container" id="loginBox">
        <div class="avatar"></div>
        <div class="username">用户</div>
        <input type="password" class="password-input" placeholder="密码" onclick="event.stopPropagation()">
        <button class="login-btn" onclick="login(event)">登录</button>
    </div>

    <!-- 登录成功遮罩 -->
    <div class="success-overlay" id="successOverlay"></div>

    <script>
        // 实时更新时间日期
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}`;

            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const week = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][now.getDay()];
            document.getElementById('date').textContent = `${year}年${month}月${day}日 ${week}`;
        }

        updateTime();
        setInterval(updateTime, 1000);

        // 显示登录框
        function showLogin() {
            document.getElementById('loginBox').classList.add('show');
            document.getElementById('hint').style.display = 'none';
        }

        // 登录模拟
        function login(e) {
            e.stopPropagation();
            document.getElementById('successOverlay').classList.add('show');
            setTimeout(() => {
                alert('登录成功！（这是伪装网页演示）');
                document.getElementById('successOverlay').classList.remove('show');
            }, 800);
        }
    </script>

</body>
</html>
